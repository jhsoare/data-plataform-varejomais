[project]
name = "data-platform-360"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "chispa>=0.9",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.13",
    "pyspark>=3.5",
]

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
